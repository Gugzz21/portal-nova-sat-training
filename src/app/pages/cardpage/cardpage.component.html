<div class="container">
  <div class="content">

    <div class="page-header">
      <h1>Meus Cards</h1>
    </div>

    <div class="scroll-area">
      <div class="cards-grid">
        <ng-container *ngIf="(cards$ | async) as cards">

          <app-card *ngFor="let card of cards" [titulo]="card.titulo" [descricao]="card.descricao"
            [imagem]="card.imagem" [role]="card.role ?? 'image'">
          </app-card>

          <p class="empty" *ngIf="cards.length === 0">
            Nenhum card disponível.
          </p>

        </ng-container>
      </div>
    </div>

  </div>
</div>
