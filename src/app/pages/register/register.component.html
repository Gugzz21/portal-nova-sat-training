<div class="themes">
    <label class="theme-switch">
        <input type="checkbox" [checked]="isDarkTheme" (change)="toggleTheme()">
        <span class="slider round">
            <span class="icon sun">☀️</span>
            <span class="icon moon">🌙</span>
        </span>
    </label>
</div>

<div class="register-container">
    <div class="register-card">
        <div class="logo-container">
            <img [src]="isDarkTheme ? 'assets/corujita preto.png' : 'assets/corujita cinza.png'" alt="Logo Portal SAT"
                class="logo-img">
        </div>
        <h2>Criar Conta</h2>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" formControlName="nome" placeholder="Seu nome completo">
                <div *ngIf="registerForm.get('nome')?.invalid && registerForm.get('nome')?.touched" class="error">
                    Nome é obrigatório.
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" formControlName="email" placeholder="Seu email">
                <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error">
                    Email válido é obrigatório.
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" formControlName="senha" placeholder="Sua senha (min. 6 caracteres)">
                <div *ngIf="registerForm.get('senha')?.invalid && registerForm.get('senha')?.touched" class="error">
                    Senha deve ter no mínimo 6 caracteres.
                </div>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="registerForm.invalid || isLoading">
                {{ isLoading ? 'Cadastrando...' : 'Cadastrar' }}
            </button>

            <div class="login-link">
                Já tem uma conta? <a routerLink="/login">Faça login</a>
            </div>
        </form>
    </div>
</div>
