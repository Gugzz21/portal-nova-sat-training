<div class="card-item">
  <div class="card-header">
    <div class="card-icon-container">
      @if (role === 'image') {
      <img [src]="imagem" alt="ícone do card" class="card-img">
      }

      @if (role === 'icon') {
      <mat-icon class="card-mat-icon">{{ imagem }}</mat-icon>
      }
    </div>

    <div class="card-content">
      <h3 class="card-title">{{ titulo }}</h3>
      <p class="card-description">{{ descricao }}</p>
    </div>
  </div>
</div>
